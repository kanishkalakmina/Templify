# Templify — self-hosted report server.
#
#   docker compose up -d
#
# Then open http://localhost:8080 for the editor, and POST to
# http://localhost:8080/api/reports/render from your application.

services:
  templify:
    # Comment `build` out to pull the published image instead of building:
    #   image: ghcr.io/kanishkalakmina/templify:latest
    build: .
    image: templify/report-server:1.0.0
    container_name: templify
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Templates and version history live here. Back this up.
      - templify-data:/data
    environment:
      # Uncomment to require `Authorization: Bearer <key>` on every /api call.
      # Leave unset when the container is only reachable from your own network.
      # TEMPLIFY_API_KEY: "change-me"
      TZ: ${TZ:-UTC}
    # Chromium needs more than Docker's default 64 MB of shared memory.
    shm_size: "512mb"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  templify-data:
